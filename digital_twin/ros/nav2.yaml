controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /postal_sim/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.04
      movement_time_allowance: 8.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.045
      yaw_goal_tolerance: 0.06
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -0.14
      max_vel_x: 0.14
      min_vel_y: -0.14
      max_vel_y: 0.14
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.14
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.8
      decel_lim_x: -0.3
      decel_lim_y: -0.3
      decel_lim_theta: -0.8
      vx_samples: 10
      vy_samples: 10
      vtheta_samples: 10
      sim_time: 1.5
      linear_granularity: 0.025
      angular_granularity: 0.025
      trans_stopped_velocity: 0.02
      critics: [Oscillation, BaseObstacle, PathDist, GoalDist, GoalAlign]
      BaseObstacle.scale: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 24.0
      GoalAlign.scale: 12.0
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: true
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: postal_sim/map
    robot_base_frame: postal_sim/base_link
    odom_topic: /postal_sim/odom
behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: postal_sim/odom
    robot_base_frame: postal_sim/base_link
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: postal_sim/odom
      robot_base_frame: postal_sim/base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.04
      robot_radius: 0.23
      update_frequency: 10.0
      publish_frequency: 5.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /postal_sim/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 4.9
          raytrace_max_range: 5.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30
        cost_scaling_factor: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: postal_sim/map
      robot_base_frame: postal_sim/base_link
      resolution: 0.04
      robot_radius: 0.23
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 1.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /postal_sim/map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /postal_sim/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 4.9
          raytrace_max_range: 5.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30
        cost_scaling_factor: 5.0
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    feedback: OPEN_LOOP
    smoothing_frequency: 20.0
    max_velocity: [0.14, 0.14, 0.5]
    min_velocity: [-0.14, -0.14, -0.5]
    max_accel: [0.3, 0.3, 0.8]
    max_decel: [-0.3, -0.3, -0.8]
    odom_topic: /postal_sim/odom
