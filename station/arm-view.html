<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Live arm — read only</title>
<style>body{margin:0;background:#151922;color:#eee;font:15px system-ui}aside{position:absolute;z-index:1;margin:16px;padding:16px;background:#202735ee;border-radius:12px;max-width:360px}h1{font-size:20px;margin:0 0 10px}p{line-height:1.5}#values{font-family:monospace;white-space:pre}canvas{display:block}</style>
<aside><h1>Live arm · read only</h1><p>Arm IDs 1–8 only. Drag to orbit; scroll to zoom.</p><p>Approximate pose: raw encoder values are mapped to the ElRobot model limits. Joint calibration and physical joint order are not yet verified.</p><p id="status">Loading 3D model…</p><div id="values"></div></aside>
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.170.0","three/":"https://esm.sh/three@0.170.0/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/examples/jsm/controls/OrbitControls.js';
import URDFLoader from 'https://esm.sh/urdf-loader@0.12.6?external=three';
const status=document.querySelector('#status'), values=document.querySelector('#values');
const scene=new THREE.Scene();scene.background=new THREE.Color('#151922');
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.001,100);camera.position.set(.8,.5,.8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.2,0);controls.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,3));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(1,2,3);scene.add(light);
scene.add(new THREE.GridHelper(1.5,15,0x667788,0x334455));
let robot=null;
const manager=new THREE.LoadingManager();manager.onError=url=>{status.textContent='Model asset failed to load: '+url;};
const loader=new URDFLoader(manager);loader.parseCollision=false;
loader.load('https://raw.githubusercontent.com/norma-core/norma-core/v0.1.0-beta.10/software/station/clients/station-viewer/public/devices/elrobot/elrobot_follower.urdf',r=>{
 robot=r;robot.rotation.set(-Math.PI/2,0,-Math.PI/2);scene.add(robot);
},undefined,e=>{status.textContent='Cannot load model: '+e;});
async function update(){
 try{
  const response=await fetch('/state');if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();
  const missing=Array.from({length:8},(_,i)=>i+1).filter(i=>data.motors[i]===undefined);
  const stale=Date.now()/1000-data.timestamp>2;
  status.textContent=stale?'Telemetry stale':missing.length?'Missing joints: '+missing.join(', '):'Live · 8 joints responding';
  values.textContent=Array.from({length:8},(_,i)=>`ID ${i+1}: ${data.motors[i+1]??'no response'} ticks`).join('\n');
  if(robot&&!stale)for(let i=1;i<=8;i++){
   const raw=data.motors[i];if(raw===undefined)continue;
   const names=i===8?['rev_motor_08','rev_motor_08_1','rev_motor_08_2']:[`rev_motor_0${i}`];
   for(const name of names){const joint=robot.joints[name];if(!joint)continue;const {lower,upper}=joint.limit;const x=lower+(raw/4095)*(upper-lower);robot.setJointValue(name,name.endsWith('_1')?x:upper-x);}
  }
 }catch(e){status.textContent='Telemetry disconnected: '+e.message;}
 setTimeout(update,150);
}
update();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></html>
